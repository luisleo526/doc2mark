name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'doc2mark/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all,dev]
          pip install ruff bandit

      # TODO: make blocking once clean (43 errors as of 2026-06-27)
      - name: Ruff check
        continue-on-error: true
        run: ruff check doc2mark/

      # TODO: make blocking once clean (48 files need reformatting as of 2026-06-27)
      - name: Black format check
        continue-on-error: true
        run: black --check doc2mark/ tests/

      # TODO: make blocking once clean (42 files have incorrect imports as of 2026-06-27)
      - name: isort import order check
        continue-on-error: true
        run: isort --check-only doc2mark/ tests/

      # TODO: make blocking once clean (11 low-severity findings as of 2026-06-27)
      - name: Bandit security check
        continue-on-error: true
        run: bandit -r doc2mark -c pyproject.toml -q

      # TODO: make blocking once clean (238 errors in 19 files as of 2026-06-27)
      - name: Mypy type check
        continue-on-error: true
        run: mypy doc2mark/

  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every Python version instead of cancelling the rest on the first failure.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all,dev]

      # tests/e2e needs Tesseract, LibreOffice and CJK fonts: it runs in the e2e job's image.
      - name: Run unit tests with coverage
        env:
          # Ensure no accidental OpenAI calls in CI
          OPENAI_API_KEY: ""
        run: |
          python -m pytest -m "not integration and not requires_api_key and not e2e" -q \
            --cov=doc2mark --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=50

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  e2e:
    name: E2E (CLI in docker, Tesseract + LibreOffice)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner script sets D2M_E2E_STRICT=1 (a missing tool fails, never skips) and installs
      # .[ocr,dev] in the container, which brings pytest-xdist. The tests are independent (fresh
      # output dirs, per-conversion LibreOffice profiles), so they run on one worker per runner CPU.
      # OMP_THREAD_LIMIT=1 is part of that: Tesseract runs several OpenMP threads for every call.
      # Without it 4 workers took 19-22 min and one of three such runs hit a test's 300 s CLI timeout
      # (8 workers: 4 timeouts); with it the suite takes ~11 min (serial: 33 min).
      - name: Run the CLI E2E suite (scripts/run_e2e_docker.sh, D2M_E2E_STRICT=1)
        env:
          OMP_THREAD_LIMIT: "1"
          D2M_E2E_PASS_ENV: OMP_THREAD_LIMIT
        run: scripts/run_e2e_docker.sh -q -p no:cacheprovider -n 4 --durations=15

  test-ocr:
    name: OCR tests (OpenAI)
    runs-on: ubuntu-latest
    needs: test
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (with OCR extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,ocr]

      - name: Run OCR-related tests
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          python -m pytest -m "requires_api_key" -q

      - name: Skip OCR tests (no OPENAI_API_KEY)
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: |
          echo "Skipping OCR tests: OPENAI_API_KEY not set in repository secrets"
